meters:
- name: active_devices
  description: Count of provisioned cellular devices under subscription, the primary cost driver.
  unit: devices
  aggregation: sum
  dimensions:
  - account
  - deviceType
  - program
- name: device_year
  description: Device-years of subscription (device count times annual term).
  unit: device_years
  aggregation: sum
  dimensions:
  - account
  - deviceType
- name: internal_ingestion_compute
  description: Internal cost of polling or receiving and storing readings (no BodyTrace invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: Track active vs inactive devices and their transmission recency; an idle device still costs subscription.
- name: Allocation
  description: Tag devices by program, clinic, or patient cohort so subscription cost maps to internal cost centers.
- name: Optimization
  description: Reclaim and deprovision devices that have stopped transmitting; right-size fleet to enrolled-patient count; prefer pushed delivery to cut internal polling compute.
- name: Accountability
  description: Assign a device-fleet owner; review device counts against active enrollment each billing cycle.
