description: >-
  FinOps view of BodyTrace spend. BodyTrace cost is driven by devices, not by API
  calls: each cellular device carries an annual per-device subscription that
  bundles the hardware, embedded cellular connectivity, the web interface, and API
  access. There is no separate metered API charge. The dominant cost driver is the
  count of active provisioned devices in the field; secondary costs are internal
  (the compute you run to poll or receive and store readings). Enterprise/volume
  agreements cover larger RPM programs.
notes: >-
  Per-device rates are not reconciled here; confirm with BodyTrace sales. The main
  FinOps lever is device fleet management - deprovision or reclaim inactive
  devices so you stop paying subscription for units no longer transmitting.
