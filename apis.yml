name: BodyTrace
kind: company
description: BodyTrace makes cellular-connected remote patient monitoring (RPM)
  devices - blood pressure monitors, body-weight scales, and pulse oximeters - that
  transmit readings directly over the cellular network with no phone, app, Wi-Fi, or
  Bluetooth pairing required. Each device encrypts measurements end-to-end and sends
  them to the BodyTrace platform, which exposes the data to healthcare organizations,
  EHRs, and RPM programs over a simple HTTP API using HTTP Basic authentication.
  Consumers can pull device readings (data values) on a polling loop or receive them
  pushed to a configured HTTP endpoint. BodyTrace sells to organizations, not
  individuals; API and device provisioning are arranged through BodyTrace sales.
